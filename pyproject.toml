[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-lite"
version = "0.1.0"
description = "Compact GraphRAG: corpus → knowledge graph → hybrid graph+vector retrieval → cited answer."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Girisankar G", email = "girisankargopakumar@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2"]
llm = ["anthropic>=0.39"]
dev = ["pytest>=7", "ruff>=0.4", "numpy>=1.24"]

[project.scripts]
grl = "graphrag_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
